<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />

    <title>Specnaut — a coordinated team of AI agents across 6 harnesses</title>
    <meta
      name="description"
      content="Specnaut scaffolds a named team of nine AI agents — developer, product-owner, specnaut-guide, code-reviewer, architect-expert, security-expert, performance-expert, accessibility-expert and dependency-expert — across 6 coding harnesses (Claude Code, Cursor, Codex, Copilot, OpenCode, Antigravity). One curl, one binary, no Python."
    />
    <meta name="specnaut-version" content="__SPECNAUT_VERSION__" />

    <link rel="canonical" href="https://specnaut.com/" />
    <link rel="alternate" type="text/markdown" href="/llms.txt" />
    <!-- In cascade order: a later sheet refines the rules of an earlier one. -->
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/landing-components.css" />
    <link rel="stylesheet" href="/landing-hero.css" />
    <link rel="stylesheet" href="/landing-sections.css" />
    <link rel="stylesheet" href="/landing-features.css" />
    <link rel="stylesheet" href="/landing.css" />

    <!-- Apply the saved theme before first paint to avoid a flash. -->
    <script>
    try {
      var t = localStorage.getItem("theme");
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {
      console.warn("theme: saved value unreadable", e);
    }
    </script>
    <script src="/theme.js" defer></script>
    <script src="/landing.js" defer></script>

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://specnaut.com/" />
    <meta property="og:title" content="Specnaut — a coordinated team of AI agents" />
    <meta
      property="og:description"
      content="9 named AI agents · 6 coding harnesses · 1 curl. Specnaut installs a structured multi-agent workflow into any repo."
    />
    <meta property="og:image" content="https://specnaut.com/assets/og-card.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Specnaut — a coordinated team of AI agents" />
    <meta
      name="twitter:description"
      content="9 named AI agents · 6 coding harnesses · 1 curl."
    />
    <meta name="twitter:image" content="https://specnaut.com/assets/og-card.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header class="band band-header">
      <div class="wrap site-header">
        <a href="/" class="brand" aria-label="Specnaut home">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">Specnaut</span>
        </a>
        <nav class="site-nav" aria-label="Primary">
          <a href="#agents">Agents</a>
          <a href="/docs/">Docs</a>
          <a href="/changelog/">Changelog</a>
          <a href="https://github.com/specnaut/specnaut-cli">GitHub</a>
          <a class="nav-cloud" href="__SPECNAUT_APP_URL__">Cloud →</a>
        </nav>
      </div>
    </header>

    <main>
      <!-- include: _landing/hero.html -->
      <!-- include: _landing/harness.html -->
      <!-- include: _landing/steps.html -->
      <!-- include: _landing/features.html -->
      <!-- include: _landing/roster.html -->
      <!-- include: _landing/cloud.html -->
      <!-- include: _landing/trust.html -->
    </main>

    <!-- Announces a copy's outcome: a button's changed label is not read out on its own. -->
    <p class="sr-only" id="copy-status" role="status" aria-live="polite"></p>

    <footer class="band band-footer">
      <div class="wrap site-footer">
        <p>
          Specnaut
          <a href="https://github.com/specnaut/specnaut-cli/releases/tag/v__SPECNAUT_VERSION__"
          >v__SPECNAUT_VERSION__</a>
          · <a href="/llms.txt">llms.txt</a>
          · <a href="/docs/">docs</a>
          · <a href="https://github.com/specnaut/specnaut-cli">github.com/specnaut/specnaut-cli</a>
        </p>
        <!-- No aria-label: the name is the visible word plus a hidden "theme", so it
             starts with what a voice-control user sees and says (WCAG 2.5.3). -->
        <button type="button" class="theme-toggle" id="theme-toggle">
          <span class="theme-toggle-icon" aria-hidden="true"></span>
          <span class="theme-toggle-label">Dark</span><span class="sr-only"> theme</span>
        </button>
      </div>
    </footer>
  </body>
</html>
